<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf6ee" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Riz Vedha — Visual GS Library for SSC CGL</title>
    <meta name="description" content="Riz Vedha is a complete visual General Studies library for SSC CGL — Parmar SSC theory, 121 chapters, 33 map libraries, 12 hand-drawn diagrams, flashcards and GK games." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Riz Vedha — Visual GS Library for SSC CGL" />
    <meta property="og:description" content="121 chapters, 33 static-GK libraries, 12 diagrams and 4 games — the whole GS syllabus as pictures, flashcards and drills." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      /* paint the saved theme before React mounts (no white flash) */
      (function () {
        try {
          var t = localStorage.getItem("rv:theme");
          var dark = t === "dark";
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..900;1,9..144,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
